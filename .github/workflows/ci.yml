name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build and check static export
        run: |
          npm run build
          test -s out/index.html
          test -s out/404.html
          test -s out/about/index.html
          test -s out/activities/index.html
          test -s out/projects/index.html
          test -s out/join/index.html
          test -s out/sitemap.xml
          test -s out/robots.txt
          test -s out/mascot.webp
          test -d out/_next/static
